services:
  - type: web
    name: equis-agent
    runtime: docker
    plan: free
    dockerfilePath: Dockerfile
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL_ID
        value: openai/gpt-oss-20b
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_LLM_MODEL
        value: gemini-3-flash-preview
      - key: GEMINI_VLM_MODEL
        value: gemini-3.5-flash
      - key: GEMINI_EMBED_MODEL
        value: models/gemini-embedding-001
      - key: PINECONE_API_KEY
        sync: false
      - key: PINECONE_INDEX_NAME
        value: gameengine-doctor
      - key: TAVILY_API_KEY
        sync: false
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
      - key: LANGCHAIN_TRACING_V2
        value: "true"
      - key: LANGCHAIN_API_KEY
        sync: false
      - key: LANGCHAIN_PROJECT
        value: gameengine-doctor
      - key: DOCS_PATH
        value: ./data/docs
      - key: TOP_K
        value: "4"
      - key: CACHE_TTL_SECONDS
        value: "3600"

  - type: cron
    name: equis-daily-ingest
    runtime: docker
    plan: free
    dockerfilePath: Dockerfile
    schedule: "0 2 * * *"
    command: python scripts/ingest.py
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_EMBED_MODEL
        value: models/gemini-embedding-001
      - key: PINECONE_API_KEY
        sync: false
      - key: PINECONE_INDEX_NAME
        value: gameengine-doctor
      - key: DOCS_PATH
        value: ./data/docs
      - key: LANGCHAIN_TRACING_V2
        value: "true"
      - key: LANGCHAIN_API_KEY
        sync: false
      - key: LANGCHAIN_PROJECT
        value: gameengine-doctor
